name: Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Determine version and tag
      - name: Determine Version and Tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            SHOULD_RELEASE="true"
            echo "Triggered by tag: $TAG (version: $VERSION)"
          else
            VERSION=$(grep -m 1 -E "^\s*\*?\s*Version:" motionkit-connector.php | sed -E 's/.*Version:\s*//' | tr -d '\r\n ')
            TAG="v${VERSION}"
            echo "Extracted version from motionkit-connector.php: $VERSION ($TAG)"
            
            # Check if tag or release already exists
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists on remote/local. Skipping release."
              SHOULD_RELEASE="false"
            else
              echo "New version detected: ${TAG}. Proceeding with release."
              SHOULD_RELEASE="true"
            fi
          fi
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "should_release=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT

      # Setup Node.js and build assets
      - name: Set up Node.js
        if: steps.vars.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build assets
        if: steps.vars.outputs.should_release == 'true'
        run: |
          npm ci
          npm run build

      # Package plugin into clean zip
      - name: Package Plugin (.zip)
        if: steps.vars.outputs.should_release == 'true'
        run: |
          PLUGIN_SLUG="motionkit-connector"
          # The archive is named for the plugin, the folder inside it for the WordPress install directory. Renaming that directory would orphan every site's activation, settings row and update check, so the two deliberately differ — mkConnector builds the same pair of names locally.
          ZIP_NAME="motionkit-with-gsap"
          BUILD_DIR="/tmp/release-build/${PLUGIN_SLUG}"
          mkdir -p "${BUILD_DIR}"
          
          # Copy files respecting .distignore
          if [ -f .distignore ]; then
            rsync -av --exclude-from='.distignore' ./ "${BUILD_DIR}/"
          else
            rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' ./ "${BUILD_DIR}/"
          fi
          
          # Create zip archive
          cd /tmp/release-build
          zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}.zip" "${PLUGIN_SLUG}"
          echo "Created ${ZIP_NAME}.zip successfully."

      # Create GitHub Release with zip attached
      - name: Create GitHub Release
        if: steps.vars.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Motionkit with GSAP ${{ steps.vars.outputs.tag }}
          files: motionkit-with-gsap.zip
          generate_release_notes: true
          draft: false
          prerelease: false
